<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="ball"><circle cx="318" cy="222" r="118"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#3d8b3d"/>
    <g fill="#469a4a">
      <rect y="0" width="512" height="64"/>
      <rect y="128" width="512" height="64"/>
      <rect y="256" width="512" height="64"/>
      <rect y="384" width="512" height="64"/>
    </g>
    <!-- curved trail of a bent shot -->
